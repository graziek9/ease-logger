name: Poll Easee

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  actions: write   # needed for gh workflow run

concurrency:
  group: easee-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run poller
        env:
          EASEE_USERNAME: ${{ secrets.EASEE_USERNAME }}
          EASEE_PASSWORD: ${{ secrets.EASEE_PASSWORD }}
          RUN_SECONDS: "840"
        run: python -u poller.py

      - name: Commit CSV
        if: always()
        run: |
          git config user.name  "easee-bot"
          git config user.email "easee-bot@users.noreply.github.com"
          git add easee_log.csv
          git diff --cached --quiet || git commit -m "log $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 2
          gh workflow run poll.yml
